
<style>
.wrap{padding:1.5rem 0 2rem;display:flex;flex-direction:column;align-items:center;gap:2rem}
.pair{display:flex;gap:24px;align-items:flex-start}
.ctx-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.clbl{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono);letter-spacing:0.1em}
.dark-bg{background:#0a0a0a;padding:20px;border-radius:16px}
.lite-bg{background:#EEEEEE;padding:20px;border-radius:16px}
.srow{display:flex;align-items:flex-end;gap:28px;padding:20px 32px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary)}
.si{display:flex;flex-direction:column;align-items:center;gap:8px}
.sl{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px}
.icard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 14px}
.ik{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono);letter-spacing:0.1em}
.iv{font-size:12px;color:var(--color-text-secondary);font-family:var(--font-mono);margin-top:3px}
.swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
</style>

<h2 class="sr-only">Favicon monograma BG com acento azul — identidade visual de Bruno Gusmão</h2>

<div class="wrap">

  <div class="pair">
    <div class="ctx-wrap">
      <span class="clbl">// dark bg</span>
      <div class="dark-bg">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
          <rect width="100" height="100" rx="22" fill="#0D0D0D"/>
          <text text-anchor="middle" x="50" y="70" font-family="'Courier New',Courier,monospace" font-size="50" font-weight="700">
            <tspan fill="#F2F2F2">B</tspan><tspan fill="#4A9EFF">G</tspan>
          </text>
        </svg>
      </div>
    </div>
    <div class="ctx-wrap">
      <span class="clbl">// light bg</span>
      <div class="lite-bg">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
          <rect width="100" height="100" rx="22" fill="#0D0D0D"/>
          <text text-anchor="middle" x="50" y="70" font-family="'Courier New',Courier,monospace" font-size="50" font-weight="700">
            <tspan fill="#F2F2F2">B</tspan><tspan fill="#4A9EFF">G</tspan>
          </text>
        </svg>
      </div>
    </div>
  </div>

  <div class="ctx-wrap">
    <span class="clbl">// preview de tamanhos</span>
    <div class="srow">
      <div class="si">
        <svg viewBox="0 0 100 100" width="80" height="80"><rect width="100" height="100" rx="22" fill="#0D0D0D"/><text text-anchor="middle" x="50" y="70" font-family="'Courier New',Courier,monospace" font-size="50" font-weight="700"><tspan fill="#F2F2F2">B</tspan><tspan fill="#4A9EFF">G</tspan></text></svg>
        <span class="sl">80px</span>
      </div>
      <div class="si">
        <svg viewBox="0 0 100 100" width="48" height="48"><rect width="100" height="100" rx="22" fill="#0D0D0D"/><text text-anchor="middle" x="50" y="70" font-family="'Courier New',Courier,monospace" font-size="50" font-weight="700"><tspan fill="#F2F2F2">B</tspan><tspan fill="#4A9EFF">G</tspan></text></svg>
        <span class="sl">48px</span>
      </div>
      <div class="si">
        <svg viewBox="0 0 100 100" width="32" height="32"><rect width="100" height="100" rx="22" fill="#0D0D0D"/><text text-anchor="middle" x="50" y="70" font-family="'Courier New',Courier,monospace" font-size="50" font-weight="700"><tspan fill="#F2F2F2">B</tspan><tspan fill="#4A9EFF">G</tspan></text></svg>
        <span class="sl">32px</span>
      </div>
      <div class="si">
        <svg viewBox="0 0 100 100" width="16" height="16"><rect width="100" height="100" rx="22" fill="#0D0D0D"/><text text-anchor="middle" x="50" y="70" font-family="'Courier New',Courier,monospace" font-size="50" font-weight="700"><tspan fill="#F2F2F2">B</tspan><tspan fill="#4A9EFF">G</tspan></text></svg>
        <span class="sl">16px</span>
      </div>
    </div>
  </div>

  <div class="info">
    <div class="icard">
      <div class="ik">FONTE</div>
      <div class="iv">Courier New 700</div>
    </div>
    <div class="icard">
      <div class="ik">FORMATO</div>
      <div class="iv">SVG · ICO · PNG</div>
    </div>
    <div class="icard">
      <div class="ik">FUNDO</div>
      <div class="iv"><span class="swatch" style="background:#0D0D0D;border:0.5px solid #333"></span>#0D0D0D</div>
    </div>
    <div class="icard">
      <div class="ik">ACENTO</div>
      <div class="iv"><span class="swatch" style="background:#4A9EFF"></span>#4A9EFF</div>
    </div>
  </div>

</div>

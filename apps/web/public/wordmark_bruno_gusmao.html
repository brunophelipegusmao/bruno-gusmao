
<style>
.wrap{padding:1.5rem 0 2rem;display:flex;flex-direction:column;align-items:center;gap:2rem}
.pair{display:flex;gap:20px;align-items:flex-start}
.ctx-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.clbl{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono);letter-spacing:0.1em}
.dark-bg{background:#0a0a0a;padding:24px 28px;border-radius:16px}
.lite-bg{background:#EEEEEE;padding:24px 28px;border-radius:16px}
.srow{display:flex;align-items:center;gap:32px;padding:20px 32px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;justify-content:center}
.si{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.sl{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px}
.icard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 14px}
.ik{font-size:10px;color:var(--color-text-tertiary);font-family:var(--font-mono);letter-spacing:0.1em}
.iv{font-size:12px;color:var(--color-text-secondary);font-family:var(--font-mono);margin-top:3px}
.swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
</style>

<h2 class="sr-only">Wordmark Bruno Gusmão — design dark tech minimalista com acento azul</h2>

  <div class="pair">

          <text x="31" y="36" font-family="'Courier New',Courier,monospace" font-size="11" font-weight="400" fill="#4D4D4D" letter-spacing="7">BRUNO</text>
          <line x1="20" y1="46" x2="180" y2="46" stroke="#4A9EFF" stroke-width="0.75"/>

        </svg>
      </div>
    </div>
    <div class="ctx-wrap">
      <span class="clbl">// light bg</span>
      <div class="lite-bg">

    </div>
  </div>

  <div class="ctx-wrap">

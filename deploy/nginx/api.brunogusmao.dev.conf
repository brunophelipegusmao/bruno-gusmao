# Nginx server block para api.brunogusmao.dev (API NestJS + WebSocket do Kanban)
#
# Fica em HTTP puro de propósito: `certbot --nginx -d brunogusmao.dev -d www.brunogusmao.dev -d api.brunogusmao.dev`
# (rodado por scripts/vps-setup.sh) reescreve este arquivo sozinho, adicionando
# o server block 443/SSL e o redirect 80->443. Não edite manualmente a parte
# de SSL depois disso — deixe o certbot cuidar da renovação.
#
# O `map` abaixo é declarado no contexto http (este arquivo é incluído dentro
# de http{} via sites-enabled/) e é global à instância do Nginx — não redeclare
# `connection_upgrade` em outro server block desta VPS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.brunogusmao.dev;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

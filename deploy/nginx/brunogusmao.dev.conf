# Nginx server block para brunogusmao.dev (+ www)
#
# Fica em HTTP puro de propósito: `certbot --nginx -d brunogusmao.dev -d www.brunogusmao.dev -d api.brunogusmao.dev`
# (rodado por scripts/vps-setup.sh) reescreve este arquivo sozinho, adicionando
# o server block 443/SSL e o redirect 80->443. Não edite manualmente a parte
# de SSL depois disso — deixe o certbot cuidar da renovação.
#
# Convenção: um arquivo por domínio em sites-available/, symlink em
# sites-enabled/. Outros sites da VPS (ex.: gameficacao.brunogusmao.dev) ganham
# seu próprio arquivo, sem tocar neste.

server {
    listen 80;
    listen [::]:80;
    server_name brunogusmao.dev www.brunogusmao.dev;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a upgrade de conexão (websocket / HMR), inofensivo em produção.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

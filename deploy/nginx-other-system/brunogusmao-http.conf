# COPIAR PARA: management-process-web/nginx/conf.d/brunogusmao-http.conf
# Porta 80: valida o ACME (webroot compartilhado) e redireciona o resto para HTTPS.
# Não interfere no server_name do outro sistema (mulimassociados.adv.br).

server {
    listen 80;
    server_name brunogusmao.dev www.brunogusmao.dev api.brunogusmao.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

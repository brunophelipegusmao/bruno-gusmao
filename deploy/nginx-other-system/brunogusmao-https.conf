# COPIAR PARA: management-process-web/nginx/conf.d/brunogusmao-https.conf
# Servido pelo MESMO container nginx do outro sistema. Roteia por server_name
# para os containers do bruno-gusmao (bruno_web / bruno_api) via DNS interno do Docker.
#
# Pré-requisito: os containers bruno_web e bruno_api precisam estar na MESMA rede
# Docker que o nginx (a rede 'shared'/internal). Ver docker-compose.yml do bruno-gusmao.

# Necessário para upgrade de WebSocket (o nginx.conf do outro sistema não tem este map).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# ── Frontend Next.js ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name brunogusmao.dev www.brunogusmao.dev;

    ssl_certificate     /etc/letsencrypt/live/brunogusmao.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunogusmao.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://bruno_web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── API NestJS + WebSocket (Kanban) ───────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.brunogusmao.dev;

    ssl_certificate     /etc/letsencrypt/live/brunogusmao.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunogusmao.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://bruno_api:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

services:
  bruno_postgres:
    image: postgres:16-alpine
    container_name: bruno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bruno_gusmao
      POSTGRES_USER: brunogusmao
      POSTGRES_PASSWORD: "11!Abril88"
    volumes:
      - bruno_postgres_data:/var/lib/postgresql/data
    networks:
      - bruno_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brunogusmao -d bruno_gusmao"]
      interval: 10s
      timeout: 5s
      retries: 5

  bruno_api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bruno_api
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      TZ: America/Sao_Paulo
    ports:
      # Só loopback: o Nginx nativo do host é quem expõe isso ao público (80/443).
      - "127.0.0.1:3001:3001"
    networks:
      - bruno_internal   # alcança o bruno_postgres
    depends_on:
      bruno_postgres:
        condition: service_healthy

  bruno_web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Auth passa por brunogusmao.dev (rewrite Next.js → API interna)
        NEXT_PUBLIC_API_URL: https://brunogusmao.dev
        NEXT_PUBLIC_WS_URL: wss://api.brunogusmao.dev
        NEXT_PUBLIC_BETTER_AUTH_URL: https://brunogusmao.dev
        API_URL: http://bruno_api:3001
    container_name: bruno_web
    restart: unless-stopped
    environment:
      # URL interna do container API usada no rewrite server-side de /api/auth/*
      API_URL: http://bruno_api:3001
    ports:
      # Só loopback: o Nginx nativo do host é quem expõe isso ao público (80/443).
      - "127.0.0.1:3000:3000"
    networks:
      - bruno_internal   # precisa alcançar a API para o rewrite server-side
    depends_on:
      bruno_api:
        condition: service_healthy

volumes:
  bruno_postgres_data:

networks:
  bruno_internal:
    driver: bridge
    ipam:
      config:
        # Subnet fixa e distinta da do evento-gamificacao (172.28.0.0/24), para as
        # duas apps coexistirem na mesma VPS sem colisão de rede Docker.
        - subnet: 172.29.0.0/24

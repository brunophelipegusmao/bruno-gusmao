services:
  bruno_postgres:
    image: postgres:16-alpine
    container_name: bruno_postgres
    restart: unless-stopped
    environment:
      # Banco do apps/api-java (Spring/Flyway) — separado do que o Nest
      # (desativado) usava. Ver docs/java-migration/00-arquitetura.md.
      POSTGRES_DB: bruno_gusmao_java
      POSTGRES_USER: brunogusmao
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - bruno_postgres_data:/var/lib/postgresql/data
    networks:
      - bruno_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brunogusmao -d bruno_gusmao_java"]
      interval: 10s
      timeout: 5s
      retries: 5

  bruno_api:
    build:
      context: .
      dockerfile: Dockerfile.api-java
    container_name: bruno_api
    restart: unless-stopped
    env_file: apps/api-java/.env
    environment:
      TZ: America/Sao_Paulo
    ports:
      # Só loopback: o Nginx nativo do host é quem expõe isso ao público (80/443).
      - "127.0.0.1:3001:3001"
    networks:
      bruno_internal:
        # Alias sem underscore: o Tomcat do Spring Boot valida o header Host
        # de forma estrita e rejeita "_" (não é válido em domain name), então
        # chamadas server-side do Next não podem usar o nome do container.
        aliases:
          - api-internal
    depends_on:
      bruno_postgres:
        condition: service_healthy

  bruno_web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # URLs públicas do backend Java — sem rewrite de auth (removido junto
        # com o BetterAuth), o cookie httpOnly do Java funciona cross-subdomain
        # via SameSite=Lax (mesmo site: brunogusmao.dev).
        NEXT_PUBLIC_API_URL: https://api.brunogusmao.dev
        NEXT_PUBLIC_WS_URL: wss://api.brunogusmao.dev
        API_URL: http://api-internal:3001
    container_name: bruno_web
    restart: unless-stopped
    environment:
      # URL interna do container API usada nas chamadas server-side (Server Components).
      # Usa o alias "api-internal" (sem underscore) em vez do nome do container
      # bruno_api — o Tomcat rejeita "_" no header Host (400 em toda chamada).
      API_URL: http://api-internal:3001
    ports:
      # Só loopback: o Nginx nativo do host é quem expõe isso ao público (80/443).
      - "127.0.0.1:3000:3000"
    networks:
      - bruno_internal   # precisa alcançar a API pra fetch server-side
    depends_on:
      bruno_api:
        condition: service_healthy

volumes:
  bruno_postgres_data:

networks:
  bruno_internal:
    driver: bridge
    ipam:
      config:
        # Subnet fixa e distinta da do evento-gamificacao (172.28.0.0/24), para as
        # duas apps coexistirem na mesma VPS sem colisão de rede Docker.
        - subnet: 172.29.0.0/24
